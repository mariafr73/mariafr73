<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Banner do GitHub de Maria Francisca</title>
  <desc id="desc">Paisagem noturna em azul, rosa e dourado com elementos de tecnologia.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1328"/>
      <stop offset="0.55" stop-color="#271b3d"/>
      <stop offset="1" stop-color="#4b233f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd58a"/>
      <stop offset="1" stop-color="#e98a66"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e66f8f"/>
      <stop offset="1" stop-color="#f1b85b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#sky)"/>
  <circle cx="982" cy="105" r="62" fill="url(#sun)" opacity="0.95" filter="url(#glow)"/>

  <g fill="#fff4e2">
    <circle cx="91" cy="62" r="2"/><circle cx="180" cy="100" r="1.5"/>
    <circle cx="742" cy="61" r="2"/><circle cx="852" cy="106" r="1.5"/>
    <circle cx="1101" cy="58" r="2"/><circle cx="1154" cy="137" r="1.4"/>
  </g>

  <g opacity="0.42" fill="none" stroke="#e98aa3" stroke-width="2">
    <path d="M760 55h58v35h50"/>
    <circle cx="760" cy="55" r="5" fill="#e98aa3"/>
    <circle cx="868" cy="90" r="5" fill="#e98aa3"/>
    <path d="M1082 226h52v-39h44"/>
    <circle cx="1082" cy="226" r="5" fill="#e98aa3"/>
    <circle cx="1178" cy="187" r="5" fill="#e98aa3"/>
  </g>

  <path d="M0 272C165 204 274 225 416 269C570 316 693 241 824 231C974 220 1080 278 1200 250V360H0Z" fill="#35204a"/>
  <path d="M0 302C143 262 270 271 395 304C529 339 661 286 786 277C926 267 1067 310 1200 288V360H0Z" fill="#18172d"/>
  <path d="M0 329C208 300 324 325 504 335C690 345 835 307 998 315C1083 319 1148 335 1200 330V360H0Z" fill="#0d1425"/>

  <g transform="translate(84 78)">
    <rect x="0" y="0" width="7" height="173" rx="3.5" fill="url(#accent)"/>
    <text x="32" y="53" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="51" font-weight="700">Maria Francisca</text>
    <text x="34" y="93" fill="#f4c5ce" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Tecnologia, criatividade e soluções reais.</text>
    <line x1="34" y1="119" x2="490" y2="119" stroke="#e98aa3" stroke-width="2" opacity="0.5"/>
    <text x="34" y="154" fill="#f8e8e9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">BTI  •  UFERSA  •  Pau dos Ferros — RN</text>
  </g>

  <g transform="translate(858 158)">
    <rect x="0" y="0" width="214" height="125" rx="10" fill="#11182c" stroke="#f0a56c" stroke-width="3"/>
    <rect x="13" y="13" width="188" height="96" rx="5" fill="#171e37"/>
    <path d="M39 43l17 14-17 14M68 72h30" fill="none" stroke="#e66f8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M108 44h55M108 58h72M108 72h45M108 86h62" stroke="#f0b861" stroke-width="4" stroke-linecap="round" opacity="0.78"/>
    <path d="M-22 126h258l-24 20H2Z" fill="#d46a87"/>
    <rect x="88" y="130" width="57" height="6" rx="3" fill="#ffd58a" opacity="0.8"/>
  </g>
</svg>
